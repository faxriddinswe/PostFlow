<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish — PostFlow</title>
    <script src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="hero-page">

    <div class="hero-nav">
        <div class="logo-text"> PostFlow</div>
        <a href="/founder-page"></a>
    </div>

    <div style="display:flex; flex-direction:column; align-items:center;">
        <div class="hero-headline">

            <h2>Telegram kanalingizga bir necha soniyada post yuboring — qulay, tez, ishonchli.</h2>
        </div>

        <div class="auth-wrapper">
            <div class="auth-card glass">
                <h1> Log in | Kirish </h1>

                <label>Username</label>
                <input type="text" id="username" placeholder="faxriddin">

                <label>Parol</label>
                <input type="password" id="password" placeholder="Parolingiz">

                <button id="loginBtn">Kirish</button>
                <div class="status" id="status"></div>

                <div class="link-row">Akkountingiz yo'qmi? <a href="/register-page">Ro'yxatdan o'tish</a></div>
            </div>
        </div>
    </div>

    <script>
        const btn = document.getElementById("loginBtn");
        const status = document.getElementById("status");

        btn.addEventListener("click", async () => {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            btn.disabled = true;
            status.className = "status";
            status.textContent = "Tekshirilmoqda...";

            try {
                const resp = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password }),
                });
                const data = await resp.json();

                if (resp.ok) {
                    localStorage.setItem("token", data.access_token);
                    status.className = "status success";
                    status.textContent = "✅ Muvaffaqiyatli! Yo'naltirilmoqda...";
                    setTimeout(() => { window.location.href = "/dashboard"; }, 800);
                } else {
                    status.className = "status error";
                    status.textContent = "❌ " + data.detail;
                }
            } catch (err) {
                status.className = "status error";
                status.textContent = "❌ Server bilan aloqa yo'q: " + err;
            }

            btn.disabled = false;
        });
    </script>
</body>

</html>
